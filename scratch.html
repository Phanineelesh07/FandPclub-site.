<!DOCTYPE html>
<html>
<head>
<style>
.gallery-item {
    position: relative;
    height: 220px;
    width: 300px;
    border-radius: 16px;
    overflow: hidden;
    background: #111;
}
.collage-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    grid-template-areas: 
        'main tr'
        'main br';
    width: 100%;
    height: 100%;
    gap: 3px;
}
.collage-grid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #555;
}
.collage-grid img:nth-child(1) { grid-area: main; background: red; }
.collage-grid img:nth-child(2) { grid-area: tr; background: green; }
.collage-grid img:nth-child(3) { grid-area: br; background: blue; }
</style>
</head>
<body>
<div class="gallery-item events-collage">
    <div class="collage-grid">
        <img>
        <img>
        <img>
    </div>
</div>
</body>
</html>
